<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="575" viewBox="0 0 1176 575" role="img" aria-labelledby="title">
<title id="title">Application workflow</title>
<rect width="1176" height="575" fill="#F5F4ED"/>
<g fill="#142B39" font-family="DejaVu Sans">
  <text x="32" y="48" font-size="32" font-weight="700">Application workflow</text>
  <g transform="translate(24 67)">
    <polyline points="314,64 379,64" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="379,64 369,68 369,60" fill="#527477"/>
    <polyline points="683,64 748,64" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="748,64 738,68 738,60" fill="#527477"/>
    <polyline points="934,109 934,157" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="934,157 930,147 938,147" fill="#527477"/>
    <polyline points="934,229 934,251 176,251 176,280" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="176,280 172,270 180,270" fill="#527477"/>
    <polyline points="564,251 564,280" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="564,280 560,270 568,270" fill="#527477"/>
    <polyline points="934,251 952,251 952,280" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="952,280 948,270 956,270" fill="#527477"/>
    <polyline points="176,375 176,401 374,401 374,426" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="374,426 370,416 378,416" fill="#527477"/>
    <polyline points="564,375 564,426" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="564,426 560,416 568,416" fill="#527477"/>
    <polyline points="952,375 952,401 754,401 754,426" fill="none" stroke="#527477" stroke-width="2.2"/><polygon points="754,426 750,416 758,416" fill="#527477"/>
    <rect x="8" y="18" width="306" height="91" fill="#FFFFFF" stroke="#9EB3B3" stroke-width="1.5"/><text x="161" y="46.5" text-anchor="middle" font-size="20" font-weight="700">Set inputs</text><text x="161" y="70.5" text-anchor="middle" font-size="20" font-weight="400">Uploads and checklist</text><text x="161" y="94.5" text-anchor="middle" font-size="20" font-weight="400">DIP settings, OCR source</text>
    <rect x="379" y="18" width="304" height="91" fill="#FFFFFF" stroke="#9EB3B3" stroke-width="1.5"/><text x="531" y="46.5" text-anchor="middle" font-size="20" font-weight="700">Analyze each file</text><text x="531" y="70.5" text-anchor="middle" font-size="20" font-weight="400">Decode, run both OCR paths</text><text x="531" y="94.5" text-anchor="middle" font-size="20" font-weight="400">and keep per-file errors</text>
    <rect x="748" y="18" width="372" height="91" fill="#FFFFFF" stroke="#9EB3B3" stroke-width="1.5"/><text x="934" y="46.5" text-anchor="middle" font-size="20" font-weight="700">Check the selected text</text><text x="934" y="70.5" text-anchor="middle" font-size="20" font-weight="400">Detect type, extract fields and</text><text x="934" y="94.5" text-anchor="middle" font-size="20" font-weight="400">check OCR readability</text>
    <rect x="748" y="157" width="372" height="72" fill="#FFFFFF" stroke="#9EB3B3" stroke-width="1.5"/><text x="934" y="188" text-anchor="middle" font-size="20" font-weight="700">Summarize required types</text><text x="934" y="212" text-anchor="middle" font-size="20" font-weight="400">Count detected and usable types</text>
    <rect x="8" y="280" width="336" height="95" fill="#FFFFFF" stroke="#9EB3B3" stroke-width="1.5"/><text x="176" y="310.5" text-anchor="middle" font-size="20" font-weight="700">Incomplete</text><text x="176" y="334.5" text-anchor="middle" font-size="20" font-weight="400">At least one required type</text><text x="176" y="358.5" text-anchor="middle" font-size="20" font-weight="400">is missing</text>
    <rect x="396" y="280" width="336" height="95" fill="#FFFFFF" stroke="#9EB3B3" stroke-width="1.5"/><text x="564" y="310.5" text-anchor="middle" font-size="20" font-weight="700">Needs Attention</text><text x="564" y="334.5" text-anchor="middle" font-size="20" font-weight="400">All types are detected, but</text><text x="564" y="358.5" text-anchor="middle" font-size="20" font-weight="400">at least one is unusable</text>
    <rect x="784" y="280" width="336" height="95" fill="#FFFFFF" stroke="#9EB3B3" stroke-width="1.5"/><text x="952" y="310.5" text-anchor="middle" font-size="20" font-weight="700">Ready</text><text x="952" y="334.5" text-anchor="middle" font-size="20" font-weight="400">Every required type has</text><text x="952" y="358.5" text-anchor="middle" font-size="20" font-weight="400">a usable file</text>
    <rect x="224" y="426" width="680" height="55" fill="#FFFFFF" stroke="#9EB3B3" stroke-width="1.5"/><text x="564" y="460.5" text-anchor="middle" font-size="20" font-weight="700">Show findings and offer JSON or Markdown</text>
  </g>
</g>
</svg>
